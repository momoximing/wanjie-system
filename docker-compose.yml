# 万界系统 · 本机一键启动
# 用法：docker compose up -d  然后浏览器打开 http://localhost:8787
# 数据落在宿主机 ./data 目录，删容器不丢。

services:
  wanjie:
    build: .
    image: wanjie:local
    container_name: wanjie
    # 安全：端口只映射到宿主机回环 127.0.0.1，同一网络的其它机器连不上（本机工具默认不对外）。
    # 端口被占用改成 "127.0.0.1:8788:8787"，并同步改 .env 的 PORT。
    # 如确需从手机/局域网访问：改成 "0.0.0.0:8787:8787" 且必须在 .env 设 WANJIE_TOKEN；
    # 更稳妥的做法是用 SSH 隧道 / VPN，而不是把 8787 直接暴露到网络。
    ports:
      - "127.0.0.1:8787:8787"
    # 数据落卷：左边是宿主机目录，右边是容器内数据目录
    volumes:
      - ./data:/app/data
    # 从 .env 读取可选配置（模型密钥等；也可在网页「模型中心」里填）
    env_file:
      - path: .env
        required: false
    environment:
      - WANJIE_DATA_DIR=/app/data
      - PORT=8787
      # 容器内必须监听所有网卡，端口映射才能通；靠容器网络边界隔离（未发布到公网）
      - WANJIE_HOST=0.0.0.0
    # 可选访问令牌：如需给接口加一层凭证，在 .env 里设 WANJIE_TOKEN=任意字符串
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
