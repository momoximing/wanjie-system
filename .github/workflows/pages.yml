name: Deploy to GitHub Pages

# 每次 push 到 main 自动部署。首次需在仓库 Settings → Pages 里
# 把 Source 选成 "GitHub Actions"（唯一需要手动点的一次）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 在线体验版只需要静态前端，不含 Node 代理（无密钥风险）。
      # 它会自动降级到 localStorage，别人点开即可体验录入流程。
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r examples _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
